# Mac 앱을 클라우드(GitHub의 Mac 컴퓨터)에서 빌드해 Releases에 올립니다.
# 받는 곳: https://github.com/leche5736-oss/study-timer/releases/latest
name: Mac 앱 만들기

on:
  push:
    branches: [main, claude/project-thread-0xriid]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: 버전 읽기
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter build macos --release
      - name: 압축
        run: |
          cd build/macos/Build/Products/Release
          mv study_timer.app "공부 타이머.app"
          ditto -c -k --keepParent "공부 타이머.app" "$GITHUB_WORKSPACE/StudyTimer-mac.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 공부 타이머 v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: StudyTimer-mac.zip
          body: |
            Mac용 공부 타이머 v${{ steps.version.outputs.version }} (커밋 ${{ github.sha }})
            StudyTimer-mac.zip을 받아 압축을 풀고 "공부 타이머" 앱을 응용 프로그램 폴더로 옮기세요.
